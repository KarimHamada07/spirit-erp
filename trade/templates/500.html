<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حصلت مشكلة — SPIRIT</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         font-family: Cairo, "Segoe UI", Tahoma, sans-serif; background: #f4f4f5; color: #111; text-align: center; }
  .box { max-width: 420px; background: #fff; border-radius: 16px; padding: 28px 22px; border-top: 5px solid #fe0000;
         box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .code { font-size: 44px; font-weight: 700; color: #fe0000; line-height: 1; }
  h1 { font-size: 22px; margin: 12px 0 8px; }
  p { color: #555; line-height: 1.8; margin: 0 0 18px; }
  a { display: inline-block; background: #000; color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 10px; font-weight: 700; }
  @media (prefers-color-scheme: dark) { body { background: #121214; color: #f2f2f2; } .box { background: #1b1b1d; } p { color: #aaa; } }
</style>
</head>
<body>
  <div class="box">
    <div class="code">500</div>
    <h1>حصلت مشكلة</h1>
    <p>حصل خطأ في السيستم. جرّب تاني بعد شوية، ولو المشكلة فضلت كلّم المسؤول.</p>
    <a href="/">ارجع للرئيسية</a>
  </div>
</body>
</html>
