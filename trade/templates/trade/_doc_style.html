<style>
  * { box-sizing: border-box; }
  body { font-family: 'Cairo', Tahoma, sans-serif; margin: 0; background: #f2f2f2; color: #111; }
  .sheet { position: relative; width: 148mm; min-height: 200mm; margin: 16px auto; background: #fff; padding: 10mm 11mm; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .brand { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #fe0000; padding-bottom: 6px; }
  .brand img { max-height: 54px; max-width: 120px; }
  .brand .shop { font-size: 20px; font-weight: 700; direction: ltr; letter-spacing: 2px; }
  .brand .no { font-size: 13px; color: #555; text-align: left; }
  .doc-title { text-align: center; font-size: 22px; font-weight: 700; margin: 10px 0 8px; }
  .doc-title span { display: inline-block; padding: 2px 22px; border: 2px solid #000; border-radius: 10px; }
  .info { font-size: 13.5px; line-height: 1.75; margin-bottom: 8px; }
  .info b { font-weight: 700; }
  table.items { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.items th { background: #000; color: #fff; padding: 5px 4px; text-align: right; font-weight: 600; }
  table.items td { padding: 5px 4px; border-bottom: 1px solid #ddd; }
  .num { text-align: left; white-space: nowrap; direction: ltr; }
  .bottom { display: flex; justify-content: space-between; gap: 14px; margin-top: 10px; font-size: 13.5px; }
  .totals { width: 52%; }
  .totals div, .pay div { display: flex; justify-content: space-between; padding: 2px 0; }
  .totals .net { font-size: 18px; font-weight: 700; border-top: 2px solid #000; margin-top: 3px; padding-top: 4px; }
  .pay { width: 44%; }
  .pay h4 { margin: 0 0 3px; font-size: 13.5px; border-bottom: 1px solid #ddd; }
  .notes { margin-top: 12px; font-size: 13.5px; border-top: 1px dashed #bbb; padding-top: 6px; white-space: pre-line; }
  .seller { margin-top: 8px; font-size: 13.5px; }
  .foot { text-align: center; margin-top: 16px; font-size: 12.5px; color: #555; }
  .stamp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); font-size: 34px; font-weight: 700;
           color: rgba(254,0,0,.22); border: 4px solid rgba(254,0,0,.22); padding: 6px 18px; border-radius: 12px; white-space: nowrap; pointer-events: none; }
  .actions { text-align: center; margin: 16px; }
  .actions a { font-family: inherit; font-size: 15px; padding: 8px 18px; border-radius: 6px; text-decoration: none; margin: 0 4px; background: #000; color: #fff; display: inline-block; }
  .share-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 6px; }
  .share-row a { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 15px; font-weight: 700; padding: 9px 18px; border-radius: 10px; text-decoration: none; color: #fff; }
  .share-row .wa { background: #25d366; } .share-row .pdf { background: #000; }
  @media screen and (max-width: 640px) { .sheet { width: auto; min-height: 0; margin: 8px; padding: 14px; } .bottom { flex-direction: column; } .totals, .pay { width: 100%; } }
  @media print { body { background: #fff; } .sheet { box-shadow: none; margin: 0; width: 100%; } .actions, .no-print { display: none !important; } }
</style>
