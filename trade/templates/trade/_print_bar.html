{# شريط اختيار حجم الورق قبل الطباعة: حراري 80mm / A6 / A5 / A4. الاستخدام: {% include "trade/_print_bar.html" with default_size="a5" %} #}
<style id="erp-print-css">
  .print-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 14px; }
  .print-bar button, .print-bar a { font-family: inherit; font-size: 15px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid #000000; background: #fff; color: #000000; cursor: pointer; text-decoration: none; }
  .print-bar button.active { background: #000000; color: #fff; }
  .print-bar .go { background: #fe0000; border-color: #fe0000; color: #fff; font-weight: 700; }
  /* مقاس الورقة على الشاشة (معاينة) = عرض الورقة كاملة بهوامشها */
  body.print-pos .sheet { width: 80mm; padding: 4mm; min-height: 0; font-size: 11px; }
  body.print-a6  .sheet { width: 105mm; padding: 5mm; min-height: 0; font-size: 11px; }
  body.print-a5  .sheet { width: 148mm; padding: 8mm; min-height: 0; font-size: 13px; }
  body.print-a4  .sheet { width: 210mm; padding: 10mm; min-height: 0; font-size: 15px; }
  body.print-pos .sheet table, body.print-pos .sheet td, body.print-pos .sheet th { font-size: 11px; }
  body.print-pos .sheet .sign, body.print-pos .sheet .foot { display: none; }
  body.print-pos .sheet .sum { width: 100%; margin: 8px 0 0; }
  body.print-pos .sheet h1 { font-size: 15px; }
  /* الحراري: عمود واحد، ومن غير الأعمدة الزيادة */
  body.print-pos .sheet .brand { flex-direction: column; gap: 2px; text-align: center; }
  body.print-pos .sheet .brand img { max-height: 40px; }
  body.print-pos .sheet .brand .no { text-align: center; }
  body.print-pos .sheet .doc-title { font-size: 15px; margin: 6px 0; }
  body.print-pos .sheet .doc-title span { padding: 1px 12px; }
  body.print-pos .sheet .info { font-size: 11px; line-height: 1.6; }
  body.print-pos .sheet .c-code, body.print-pos .sheet .c-cat { display: none; }
  body.print-pos .sheet table.items th, body.print-pos .sheet table.items td { padding: 3px 2px; }
  body.print-pos .sheet .bottom { flex-direction: column; gap: 6px; font-size: 11.5px; }
  body.print-pos .sheet .totals, body.print-pos .sheet .pay { width: 100%; }
  body.print-pos .sheet .totals .net { font-size: 15px; }
  body.print-pos .sheet .notes, body.print-pos .sheet .seller { font-size: 11px; }
  body.print-pos .sheet .foot { display: block; font-size: 11px; margin-top: 8px; }
  body.print-pos .sheet .stamp { font-size: 22px; }
  body.print-a4 .sheet table, body.print-a4 .sheet td, body.print-a4 .sheet th { font-size: 15px; }
  body.print-a4 .sheet .doc-title { font-size: 28px; }
  body.print-a4 .sheet .info, body.print-a4 .sheet .bottom { font-size: 15px; }
  body.print-a4 .sheet .totals .net { font-size: 22px; }
  body.print-a4 .sheet h1 { font-size: 28px; }
  @media print {
    .print-bar, .actions, .no-print { display: none !important; }
    html, body { background: #fff !important; margin: 0 !important; }
    .sheet { box-shadow: none !important; margin: 0 auto !important; padding: 0 !important; }
    body.print-pos .sheet { width: 72mm; }
    body.print-a6  .sheet { width: 95mm; }
    body.print-a5  .sheet { width: 132mm; }
    body.print-a4  .sheet { width: 190mm; }
  }
</style>
<div class="print-bar no-print" data-default="{{ default_size|default:'a5' }}" data-kind="{{ print_kind|default:'' }}">
  <span>حجم الورق:</span>
  <button type="button" data-size="pos">حراري 80mm</button>
  <button type="button" data-size="a6">A6</button>
  <button type="button" data-size="a5">A5</button>
  <button type="button" data-size="a4">A4</button>
  <button type="button" class="go" id="print-go">طباعة</button>
</div>
<script>
(function () {
  var bar = document.querySelector(".print-bar");
  // الورقة (بالـ mm) + هامش الصفحة: الحراري بيتطبع على رول 80mm
  // أبعاد صريحة بالـ mm (المتصفح مش بيعرف الاسم A6)
  var PAGES = {pos: ["80mm 297mm", "4mm"], a6: ["105mm 148mm", "5mm"], a5: ["148mm 210mm", "8mm"], a4: ["210mm 297mm", "10mm"]};
  var def = bar.getAttribute("data-default") || "a5";
  // كل نوع فاتورة بيفتكر حجمه لوحده (الجملة A4 على الطابعة العادية، والقطاعي حراري)
  var KEY = "erp-print-size" + (bar.getAttribute("data-kind") ? "-" + bar.getAttribute("data-kind") : "");
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  var style = document.createElement("style");
  style.id = "erp-page-size";
  document.head.appendChild(style);
  function setSize(k) {
    if (!PAGES[k]) k = def;
    ["pos", "a6", "a5", "a4"].forEach(function (s) { document.body.classList.remove("print-" + s); });
    document.body.classList.add("print-" + k);
    style.textContent = "@page{size:" + PAGES[k][0] + ";margin:" + PAGES[k][1] + "}";
    bar.querySelectorAll("button[data-size]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-size") === k);
    });
    try { localStorage.setItem(KEY, k); } catch (e) {}
  }
  bar.querySelectorAll("button[data-size]").forEach(function (b) {
    b.addEventListener("click", function () { setSize(b.getAttribute("data-size")); });
  });
  document.getElementById("print-go").addEventListener("click", function () { window.print(); });
  setSize(saved && PAGES[saved] ? saved : def);
})();
</script>
