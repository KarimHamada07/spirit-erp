{# كشف حساب: فترة اختيارية + PDF أو Excel. محتاج pdf_url و xlsx_url #}
<form method="get" class="statement-box no-print" target="_blank">
  <span class="sb-title"><i class="fas fa-file-invoice"></i> كشف الحساب</span>
  <label>من <input type="date" name="from" class="form-control form-control-sm"></label>
  <label>إلى <input type="date" name="to" class="form-control form-control-sm"></label>
  <button class="btn btn-sm btn-primary" formaction="{{ pdf_url }}"><i class="fas fa-file-pdf"></i> PDF</button>
  <button class="btn btn-sm btn-dark" formaction="{{ xlsx_url }}"><i class="fas fa-file-excel"></i> Excel</button>
  <small class="text-muted">سيب التواريخ فاضية = كل الحركات</small>
</form>
<style>
  .statement-box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; margin-bottom: 14px;
    border: 1px solid var(--erp-line,#e2e2e4); border-radius: 12px; background: var(--erp-card,#fff); }
  .statement-box .sb-title { font-weight: 700; margin-left: 6px; }
  .statement-box label { display: flex; align-items: center; gap: 6px; margin: 0; }
  .statement-box input { width: 150px; }
  @media (max-width: 767px) { .statement-box label { flex: 1 1 45%; } .statement-box input { width: 100%; } }
</style>
